
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroTap</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; padding: 0; background: #0b0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: #131a26; border-bottom: 1px solid #1f293a; }
    .rank { font-size: 14px; font-weight: 600; color: #38bdf8; }
    .balance-box { text-align: center; margin-top: 16px; }
    .balance-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .balance { font-size: 42px; font-weight: 800; margin: 4px 0; color: #f8fafc; }
    .tap-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .jet-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #1e293b 0%, #0f172a 75%); border: 4px solid #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.08s ease; }
    .jet-btn:active { transform: scale(0.94); }
    .jet-icon { font-size: 74px; line-height: 1; pointer-events: none; }
    .jet-name { margin-top: 8px; font-size: 13px; color: #94a3b8; font-weight: 600; pointer-events: none; }
    .boost-active { border-color: #f59e0b !important; box-shadow: 0 0 40px rgba(245, 158, 11, 0.6) !important; }
    .energy-box { padding: 0 20px 12px; }
    .energy-text { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .progress-bg { width: 100%; height: 10px; background: #1e293b; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 100%; transition: width 0.2s; }
    .controls { padding: 12px 16px 24px; background: #131a26; border-top: 1px solid #1f293a; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 10; }
    .btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn:active { background: #334155; }
    .btn-ad { background: linear-gradient(135deg, #d97706, #f59e0b); border: none; color: #000; font-weight: 700; }
    .btn-full { grid-column: span 2; background: #0284c7; border: none; }
    .float-num { position: absolute; font-size: 26px; font-weight: 800; color: #38bdf8; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
  </style>
</head>
<body>
  <div class="header">
    <div id="user-name">Pilot</div>
    <div class="rank" id="rank-name">Level 1: Prop Plane</div>
  </div>

  <div class="balance-box">
    <div class="balance-label">$AERO Points</div>
    <div class="balance" id="score">0</div>
  </div>

  <div class="tap-area" id="tap-zone">
    <div class="jet-btn" id="jet-btn">
      <div class="jet-icon" id="jet-icon">🛩️</div>
      <div class="jet-name" id="tap-power">+1 per tap</div>
    </div>
  </div>

  <div class="energy-box">
    <div class="energy-text">
      <span>⚡ Fuel</span>
      <span id="energy-val">1000 / 1000</span>
    </div>
    <div class="progress-bg"><div class="progress-fill" id="energy-bar"></div></div>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="upgrade-btn">⬆️ Upgrade (<span id="upgrade-cost">100</span>)</button>
    <button type="button" class="btn btn-ad" id="ad-btn">📺 Turbo x3 (Ad)</button>
    <button type="button" class="btn btn-full" id="invite-btn">👥 Invite Friend (+500 $AERO)</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
      }
    }

    let state = JSON.parse(localStorage.getItem('aerotap_save')) || {
      score: 0,
      power: 1,
      level: 1,
      upgradeCost: 100,
      energy: 1000,
      maxEnergy: 1000
    };

    let multiplier = 1;
    const ranks = [
      { lvl: 1, name: 'Level 1: Prop Plane', icon: '🛩️' },
      { lvl: 3, name: 'Level 3: Business Jet', icon: '🛫' },
      { lvl: 6, name: 'Level 6: Supersonic', icon: '✈️' },
      { lvl: 10, name: 'Level 10: Stratosphere', icon: '🚀' }
    ];

    function save() { localStorage.setItem('aerotap_save', JSON.stringify(state)); }

    function updateUI() {
      document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
      document.getElementById('tap-power').innerText = `+${state.power * multiplier} per tap`;
      document.getElementById('upgrade-cost').innerText = state.upgradeCost;
      document.getElementById('energy-val').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
      document.getElementById('energy-bar').style.width = `${(state.energy / state.maxEnergy) * 100}%`;
      let currentRank = ranks[0];
      for (let r of ranks) { if (state.level >= r.lvl) currentRank = r; }
      document.getElementById('rank-name').innerText = currentRank.name;
      document.getElementById('jet-icon').innerText = currentRank.icon;
    }

    document.getElementById('jet-btn').addEventListener('click', (e) => {
      if (state.energy < state.power) return;
      const gain = state.power * multiplier;
      state.score += gain;
      state.energy -= state.power;
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {}
      }

      const num = document.createElement('div');
      num.className = 'float-num';
      num.innerText = `+${gain}`;
      const rect = document.getElementById('tap-zone').getBoundingClientRect();
      const x = e.clientX ? (e.clientX - rect.left - 15) : (rect.width / 2 - 15);
      const y = e.clientY ? (e.clientY - rect.top - 30) : (rect.height / 2 - 30);
      num.style.left = `${x}px`;
      num.style.top = `${y}px`;
      document.getElementById('tap-zone').appendChild(num);
      setTimeout(() => num.remove(), 800);

      save();
      updateUI();
    });

    document.getElementById('upgrade-btn').addEventListener('click', () => {
      if (state.score >= state.upgradeCost) {
        state.score -= state.upgradeCost;
        state.level += 1;
        state.power += 1;
        state.maxEnergy += 200;
        state.upgradeCost = Math.floor(state.upgradeCost * 1.8);
        save();
        updateUI();
      } else {
        const btn = document.getElementById('upgrade-btn');
        const oldText = btn.innerHTML;
        btn.innerText = '❌ Need ' + state.upgradeCost;
        setTimeout(() => { btn.innerHTML = oldText; updateUI(); }, 1000);
      }
    });

    document.getElementById('ad-btn').addEventListener('click', () => {
      if (multiplier === 3) return;
      multiplier = 3;
      document.getElementById('jet-btn').classList.add('boost-active');
      document.getElementById('ad-btn').innerText = '🔥 Turbo x3 ACTIVE!';
      updateUI();
      setTimeout(() => {
        multiplier = 1;
        document.getElementById('jet-btn').classList.remove('boost-active');
        document.getElementById('ad-btn').innerText = '📺 Turbo x3 (Ad)';
        updateUI();
      }, 30000);
    });

    document.getElementById('invite-btn').addEventListener('click', () => {
      const botUsername = 'aerotap_bot';
      const shareUrl = `https://t.me{botUsername}&text=Join%20AeroTap%20and%20mine%20$AERO%20before%20listing!`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
      state.score += 500;
      save();
      updateUI();
    });

    setInterval(() => {
      if (state.energy < state.maxEnergy) {
        state.energy = Math.min(state.maxEnergy, state.energy + 3);
        save();
        updateUI();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
