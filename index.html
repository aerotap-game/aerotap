<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroTap</title>
  <script src="https://telegram.org"></script>
  <script src="https://adsgram.ai"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0b0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #131a26; border-bottom: 1px solid #1f293a; font-weight: 600; font-size: 14px; }
    .rank { color: #38bdf8; }
    .stats-bar { display: flex; justify-content: space-around; background: #131a26; padding: 8px 12px; border-bottom: 1px solid #1f293a; font-size: 12px; }
    .stat-item { text-align: center; }
    .stat-label { color: #94a3b8; margin-bottom: 2px; }
    .stat-val { color: #38bdf8; font-weight: 700; font-size: 14px; }
    .balance-box { text-align: center; margin-top: 14px; }
    .balance-label { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }
    .balance { font-size: 42px; font-weight: 800; margin: 2px 0; }
    .tab-content { flex: 1; display: none; flex-direction: column; overflow-y: auto; }
    .tab-content.active { display: flex; }
    .tap-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .jet-btn { width: 205px; height: 205px; border-radius: 50%; background: radial-gradient(circle, #1e293b 0%, #0f172a 75%); border: 4px solid #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s; }
    .jet-btn:active { transform: scale(0.92); }
    .jet-icon { font-size: 70px; pointer-events: none; }
    .jet-name { margin-top: 6px; font-size: 13px; color: #94a3b8; font-weight: 600; pointer-events: none; }
    .boost { border-color: #f59e0b !important; box-shadow: 0 0 40px rgba(245, 158, 11, 0.7) !important; }
    .energy-box { padding: 0 20px 12px; }
    .energy-text { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .progress-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 100%; transition: width 0.15s; }
    .quick-actions { padding: 0 16px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:active { opacity: 0.7; }
    .btn-ad { background: linear-gradient(135deg, #d97706, #f59e0b); border: none; color: #000; }
    .shop-list { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .shop-title { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .card { background: #131a26; border: 1px solid #1f293a; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-info { display: flex; align-items: center; gap: 12px; }
    .card-icon { font-size: 28px; background: #1e293b; width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .card-name { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .card-sub { font-size: 12px; color: #38bdf8; margin-top: 2px; }
    .card-lvl { font-size: 11px; color: #64748b; margin-top: 2px; }
    .buy-btn { background: #0284c7; border: none; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; min-width: 85px; }
    .buy-btn:active { opacity: 0.8; }
    .friends-box { padding: 20px 16px; text-align: center; }
    .friends-card { background: #131a26; border: 1px solid #1f293a; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .btn-full { width: 100%; background: #0284c7; border: none; padding: 14px; font-size: 14px; }
    .btn-done { background: #1e293b !important; color: #94a3b8 !important; border: 1px solid #334155 !important; }
    .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #131a26; border-top: 1px solid #1f293a; padding: 8px 10px 18px; gap: 8px; }
    .nav-btn { background: transparent; border: none; color: #64748b; font-size: 12px; font-weight: 700; padding: 8px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-btn.active { background: #1e293b; color: #38bdf8; }
    .float-num { position: absolute; font-size: 26px; font-weight: 800; color: #38bdf8; pointer-events: none; animation: up 0.7s ease-out forwards; }
    @keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
    .toast { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: #0284c7; color: #fff; padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 700; z-index: 99; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="header">
    <div id="user-name">Pilot</div>
    <div class="rank" id="rank-name">Level 1: Prop Plane</div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-label">Tap Power</div>
      <div class="stat-val" id="stat-tap">+1</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Profit / Hour</div>
      <div class="stat-val" id="stat-pph">0 / hr</div>
    </div>
  </div>

  <div class="balance-box">
    <div class="balance-label">$AERO BALANCE</div>
    <div class="balance" id="score">0</div>
  </div>

  <div class="tab-content active" id="tab-tap">
    <div class="tap-area" id="tap-zone">
      <div class="jet-btn" id="jet-btn" onclick="tapPlane(event)">
        <div class="jet-icon" id="jet-icon">🛩️</div>
        <div class="jet-name" id="tap-power">+1 per tap</div>
      </div>
    </div>

    <div class="energy-box">
      <div class="energy-text">
        <span>⚡ Fuel</span>
        <span id="energy-val">1000 / 1000</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" id="energy-bar"></div></div>
    </div>

    <div class="quick-actions">
      <button class="btn" id="upgrade-btn" onclick="buyUpgrade()">⬆️ Tap Lvl (<span id="tap-cost">100</span>)</button>
      <button class="btn btn-ad" id="ad-btn" onclick="activateTurbo()">📺 Turbo x3 (Ad)</button>
    </div>
  </div>

  <div class="tab-content" id="tab-shop">
    <div class="shop-list">
      <div class="shop-title">🛒 Auto-Clickers & Passive Income</div>
      <div id="cards-container"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-friends">
    <div class="friends-box">
      <div class="friends-card">
        <div style="font-size: 42px; margin-bottom: 8px;">🎁</div>
        <div style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">Invite Pilots & Earn</div>
        <div style="font-size: 13px; color: #94a3b8; line-height: 1.4;">Share your personal link! You get <b>+500 $AERO</b> and your friend starts with a <b>+250 $AERO</b> welcome bonus.</div>
      </div>
      <button class="btn btn-full" id="invite-btn" onclick="inviteFriend()">👥 Share & Claim +500 $AERO</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-tap" onclick="switchTab('tap')">✈️<span>Flight</span></button>
    <button class="nav-btn" id="nav-shop" onclick="switchTab('shop')">🛒<span>Shop</span></button>
    <button class="nav-btn" id="nav-friends" onclick="switchTab('friends')">👥<span>Friends</span></button>
  </div>

  <script>
    let state = {
      score: 0,
      power: 1,
      level: 1,
      cost: 100,
      energy: 1000,
      maxEnergy: 1000,
      pph: 0,
      shared: false,
      lastTime: Date.now(),
      cards: [
        { id: 'autoclicker', name: 'Auto-Clicker Bot', icon: '🤖', baseCost: 500, basePph: 1000, lvl: 0 },
        { id: 'hangar', name: 'Private Hangar', icon: '🏢', baseCost: 2000, basePph: 4500, lvl: 0 },
        { id: 'airline', name: 'Global Airline', icon: '🌍', baseCost: 10000, basePph: 25000, lvl: 0 },
        { id: 'spaceport', name: 'Orbital Spaceport', icon: '🛰️', baseCost: 50000, basePph: 150000, lvl: 0 }
      ]
    };

    let mult = 1, userId = 'pilot', AdController = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    try {
      if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: "59556" });
      }
      const saved = JSON.parse(localStorage.getItem('aerotap_v9'));
      if (saved) {
        state = { ...state, ...saved };
        if (state.pph > 0 && state.lastTime) {
          const diffSec = Math.min(10800, Math.floor((Date.now() - state.lastTime) / 1000));
          if (diffSec > 10) {
            const offlineEarned = Math.floor((state.pph / 3600) * diffSec);
            if (offlineEarned > 0) {
              state.score += offlineEarned;
              setTimeout(() => showToast('🤖 Auto-Clicker earned +' + offlineEarned.toLocaleString() + ' $AERO!'), 500);
            }
          }
        }
      }
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        const u = window.Telegram.WebApp.initDataUnsafe?.user;
        if (u) {document.getElementById('user-name').innerText = '@' + (u.username || u.first_name);
userId = u.id || 'pilot';
}
}
const urlParams = new URLSearchParams(window.location.search);
const startParam = window.Telegram?.WebApp?.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam');
if (startParam && !localStorage.getItem('aerotap_ref_used')) {
state.score += 250;
localStorage.setItem('aerotap_ref_used', '1');
}
} catch (e) {}
function getCardCost(card) {
return Math.floor(card.baseCost * Math.pow(1.6, card.lvl));
}
function renderShop() {
const container = document.getElementById('cards-container');
container.innerHTML = '';
state.cards.forEach((card, idx) => {
const cCost = getCardCost(card);
const div = document.createElement('div');
div.className = 'card';
div.innerHTML = <div class="card-info"> <div class="card-icon">${card.icon}</div> <div> <div class="card-name">${card.name}</div> <div class="card-sub">+${card.basePph.toLocaleString()} / hr</div> <div class="card-lvl">Level ${card.lvl}</div> </div> </div> <button class="buy-btn" onclick="buyCard(${idx})">${cCost.toLocaleString()}</button>;
container.appendChild(div);
});
}
function buyCard(idx) {
const card = state.cards[idx];
const cCost = getCardCost(card);
if (state.score >= cCost) {
state.score -= cCost;
card.lvl += 1;
state.pph += card.basePph;
showToast('✅ ' + card.name + ' upgraded to Lvl ' + card.lvl + '!');
renderShop();
render();
} else {
showToast('❌ Need ' + cCost.toLocaleString() + ' $AERO');
}
}
function switchTab(tab) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
document.getElementById('tab-' + tab).classList.add('active');
document.getElementById('nav-' + tab).classList.add('active');
if (tab === 'shop') renderShop();
}
function render() {
document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
document.getElementById('stat-tap').innerText = '+' + (state.power * mult);
document.getElementById('stat-pph').innerText = state.pph.toLocaleString() + ' / hr';
document.getElementById('tap-power').innerText = '+' + (state.power * mult) + ' per tap';
document.getElementById('upgrade-btn').innerText = '⬆️ Tap Lvl (' + state.cost + ')';
document.getElementById('energy-val').innerText = Math.floor(state.energy) + ' / ' + state.maxEnergy;
document.getElementById('energy-bar').style.width = (state.energy / state.maxEnergy * 100) + '%';
let rName = 'Level ' + state.level + ': Prop Plane', rIcon = '🛩️';
if (state.level >= 10) { rName = 'Level ' + state.level + ': Stratosphere'; rIcon = '🚀'; }
else if (state.level >= 6) { rName = 'Level ' + state.level + ': Supersonic'; rIcon = '✈️'; }
else if (state.level >= 3) { rName = 'Level ' + state.level + ': Business Jet'; rIcon = '🛫'; }
document.getElementById('rank-name').innerText = rName;
document.getElementById('jet-icon').innerText = rIcon;
if (state.shared) {
const invBtn = document.getElementById('invite-btn');
invBtn.innerText = '📋 Copy Invite Link (+500 Claimed)';
invBtn.classList.add('btn-done');
}
state.lastTime = Date.now();
try { localStorage.setItem('aerotap_v9', JSON.stringify(state)); } catch (e) {}
}
function tapPlane(e) {
if (state.energy < state.power) return;
const gain = state.power * mult;
state.score += gain;
state.energy -= state.power;
const el = document.createElement('div');
el.className = 'float-num';
el.innerText = '+' + gain;
el.style.left = ((e.clientX || 150) - 20) + 'px';
el.style.top = ((e.clientY || 250) - 30) + 'px';
document.body.appendChild(el);
setTimeout(() => el.remove(), 700);
render();
}
function buyUpgrade() {
if (state.score >= state.cost) {
state.score -= state.cost;
state.level += 1;
state.power += 1;
state.maxEnergy += 200;
state.cost = Math.floor(state.cost * 1.8);
render();
} else {
showToast('❌ Need ' + state.cost + ' $AERO');
}
}
function startBoost() {
mult = 3;
document.getElementById('jet-btn').classList.add('boost');
document.getElementById('ad-btn').innerText = '🔥 Turbo x3 ON!';
render();
setTimeout(() => {
mult = 1;
document.getElementById('jet-btn').classList.remove('boost');
document.getElementById('ad-btn').innerText = '📺 Turbo x3 (Ad)';
render();
}, 30000);
}
function activateTurbo() {
if (mult === 3) return;
if (AdController) {
AdController.show().then(() => {
startBoost();
}).catch(() => {
startBoost();
});
} else {
startBoost();
}
}
function inviteFriend() {
const refLink = 't.me_' + userId;
const inviteText = '🚀 Join AeroTap with me and get +250 $AERO bonus points before token listing!\n\n🔥 Залетай в AeroTap по моей ссылке и забирай +250 $AERO бонусом до листинга токена!\n👉 ' + refLink;
if (navigator.clipboard) navigator.clipboard.writeText(inviteText);
if (!state.shared) {
state.score += 500;
state.shared = true;
showToast('✅ +500 $AERO claimed & link copied!');
render();
} else {
showToast('📋 Invite message copied!');
}
}
setInterval(() => {
if (state.energy < state.maxEnergy) {
state.energy = Math.min(state.maxEnergy, state.energy + 3);
}
if (state.pph > 0) {
state.score += state.pph / 3600;
}
render();
}, 1000);
renderShop();
render();
