<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroTap</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0b0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { padding: 16px; display: flex; justify-content: space-between; background: #131a26; border-bottom: 1px solid #1f293a; font-weight: 600; }
    .rank { color: #38bdf8; }
    .balance-box { text-align: center; margin-top: 20px; }
    .balance-label { font-size: 12px; color: #94a3b8; letter-spacing: 1px; }
    .balance { font-size: 46px; font-weight: 800; margin: 4px 0; }
    .tap-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .jet-btn { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #1e293b 0%, #0f172a 75%); border: 4px solid #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.05s; }
    .jet-btn:active { transform: scale(0.92); }
    .jet-icon { font-size: 76px; pointer-events: none; }
    .jet-name { margin-top: 8px; font-size: 14px; color: #94a3b8; font-weight: 600; pointer-events: none; }
    .boost { border-color: #f59e0b !important; box-shadow: 0 0 40px rgba(245, 158, 11, 0.7) !important; }
    .energy-box { padding: 0 20px 14px; }
    .energy-text { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .progress-bg { width: 100%; height: 10px; background: #1e293b; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 100%; transition: width 0.15s; }
    .controls { padding: 14px 16px 24px; background: #131a26; border-top: 1px solid #1f293a; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn:active { opacity: 0.7; }
    .btn-ad { background: linear-gradient(135deg, #d97706, #f59e0b); border: none; color: #000; }
    .btn-full { grid-column: span 2; background: #0284c7; border: none; }
    .btn-done { background: #1e293b !important; color: #94a3b8 !important; border: 1px solid #334155 !important; }
    .float-num { position: absolute; font-size: 28px; font-weight: 800; color: #38bdf8; pointer-events: none; animation: up 0.7s ease-out forwards; }
    @keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
  </style>
</head>
<body>
  <div class="header">
    <div id="user-name">Pilot</div>
    <div class="rank" id="rank-name">Level 1: Prop Plane</div>
  </div>

  <div class="balance-box">
    <div class="balance-label">$AERO POINTS</div>
    <div class="balance" id="score">0</div>
  </div>

  <div class="tap-area" id="tap-zone">
    <div class="jet-btn" id="jet-btn" onclick="tapPlane(event)">
      <div class="jet-icon" id="jet-icon">🛩️</div>
      <div class="jet-name" id="tap-power">+1 per tap</div>
    </div>
  </div>

  <div class="energy-box">
    <div class="energy-text">
      <span>⚡ Fuel</span>
      <span id="energy-val">1000 / 1000</span>
    </div>
    <div class="progress-bg"><div class="progress-fill" id="energy-bar"></div></div>
  </div>

  <div class="controls">
    <button class="btn" id="upgrade-btn" onclick="buyUpgrade()">⬆️ Upgrade (100)</button>
    <button class="btn btn-ad" id="ad-btn" onclick="activateTurbo()">📺 Turbo x3 (Ad)</button>
    <button class="btn btn-full" id="invite-btn" onclick="inviteFriend()">👥 Share & Claim +500 $AERO</button>
  </div>

  <script>
    let score = 0, power = 1, level = 1, cost = 100, energy = 1000, maxEnergy = 1000, mult = 1, shared = false;

    try {
      const saved = JSON.parse(localStorage.getItem('aerotap_v4'));
      if (saved) { score = saved.score; power = saved.power; level = saved.level; cost = saved.cost; energy = saved.energy; maxEnergy = saved.maxEnergy; shared = saved.shared || false; }
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        const u = window.Telegram.WebApp.initDataUnsafe?.user;
        if (u) document.getElementById('user-name').innerText = '@' + (u.username || u.first_name);
      }
    } catch (e) {}

    function render() {
      document.getElementById('score').innerText = Math.floor(score).toLocaleString();
      document.getElementById('tap-power').innerText = '+' + (power * mult) + ' per tap';
      document.getElementById('upgrade-btn').innerText = '⬆️ Upgrade (' + cost + ')';
      document.getElementById('energy-val').innerText = Math.floor(energy) + ' / ' + maxEnergy;
      document.getElementById('energy-bar').style.width = (energy / maxEnergy * 100) + '%';
      let rName = 'Level ' + level + ': Prop Plane', rIcon = '🛩️';
      if (level >= 10) { rName = 'Level ' + level + ': Stratosphere'; rIcon = '🚀'; }
      else if (level >= 6) { rName = 'Level ' + level + ': Supersonic'; rIcon = '✈️'; }
      else if (level >= 3) { rName = 'Level ' + level + ': Business Jet'; rIcon = '🛫'; }
      document.getElementById('rank-name').innerText = rName;
      document.getElementById('jet-icon').innerText = rIcon;
      if (shared) {
        const invBtn = document.getElementById('invite-btn');
        invBtn.innerText = '📋 Copy Invite Link (+500 Claimed)';
        invBtn.classList.add('btn-done');
      }
      try { localStorage.setItem('aerotap_v4', JSON.stringify({ score, power, level, cost, energy, maxEnergy, shared })); } catch (e) {}
    }

    function tapPlane(e) {
      if (energy < power) return;
      const gain = power * mult;
      score += gain;
      energy -= power;
      const el = document.createElement('div');
      el.className = 'float-num';
      el.innerText = '+' + gain;
      el.style.left = ((e.clientX || 150) - 20) + 'px';
      el.style.top = ((e.clientY || 250) - 30) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
      render();
    }

    function buyUpgrade() {
      if (score >= cost) {
        score -= cost;
        level += 1;
        power += 1;
        maxEnergy += 200;
        cost = Math.floor(cost * 1.8);
        render();
      } else {
        const btn = document.getElementById('upgrade-btn');
        btn.innerText = '❌ Need ' + cost;
        setTimeout(render, 800);
      }
    }

    function activateTurbo() {
      if (mult === 3) return;
      mult = 3;
      document.getElementById('jet-btn').classList.add('boost');
      document.getElementById('ad-btn').innerText = '🔥 Turbo x3 ON!';
      render();
      setTimeout(() => {
        mult = 1;
        document.getElementById('jet-btn').classList.remove('boost');
        document.getElementById('ad-btn').innerText = '📺 Turbo x3 (Ad)';
        render();
      }, 30000);
    }

    function inviteFriend() {
      const botLink = 'https://t.me';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(botLink);
      }
      if (!shared) {
        score += 500;
        shared = true;
        render();
      } else {
        const invBtn = document.getElementById('invite-btn');
        invBtn.innerText = '✅ Link Copied to Clipboard!';
        setTimeout(render, 1200);
      }
      const shareUrl = 'https://t.me' + encodeURIComponent(botLink) + '&text=' + encodeURIComponent('Join AeroTap and mine $AERO!');
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
          window.Telegram.WebApp.openTelegramLink(shareUrl);
        }
      } catch (e) {}
    }

    setInterval(() => {
      if (energy < maxEnergy) { energy = Math.min(maxEnergy, energy + 3); render(); }
    }, 1000);

    render();
  </script>
</body>
</html>
