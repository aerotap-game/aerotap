<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>$AERO // NEBULA</title>
<script src="https://telegram.org"></script>
<style>
:root {
    --bg: #070812;
    --card: rgba(20, 24, 42, 0.88);
    --line: rgba(255, 255, 255, 0.12);
    --cyan: #00f0ff;
    --indigo: #6366f1;
    --pink: #ff2a85;
    --gold: #ffc800;
    --txt: #ffffff;
    --sub: #8b95b5;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
body { background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
.orb { position: absolute; border-radius: 50%; filter: blur(95px); pointer-events: none; z-index: 0; }
.o1 { width: 280px; height: 280px; background: rgba(99, 102, 241, 0.35); top: -70px; left: -50px; }
.o2 { width: 260px; height: 260px; background: rgba(0, 240, 255, 0.18); bottom: 40px; right: -50px; }

.top-bar { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 8px; }
.user-pill { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); padding: 5px 12px 5px 6px; border-radius: 99px; font-size: 13px; font-weight: 800; color: #fff; cursor: pointer; }
.ava { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--indigo)); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.top-r { display: flex; align-items: center; gap: 8px; }
.snd-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: #fff; font-size: 15px; cursor: pointer; }
.bal-pill { display: flex; align-items: center; gap: 6px; background: rgba(0, 240, 255, 0.12); border: 1px solid rgba(0, 240, 255, 0.4); padding: 6px 14px; border-radius: 99px; font-weight: 900; color: var(--cyan); font-size: 15px; }
.bal-pill span:first-child { background: var(--cyan); color: #000; font-size: 10px; padding: 2px 6px; border-radius: 99px; }

.screen { position: relative; z-index: 2; flex: 1; display: none; flex-direction: column; justify-content: space-between; padding: 4px 16px 12px; overflow-y: auto; }
.screen.active { display: flex; }

.hist-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.h-chip { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.h-chip.win { color: var(--cyan); border-color: rgba(0, 240, 255, 0.4); }
.h-chip.loss { color: var(--pink); }

.arena { position: relative; flex: 1; margin: 4px 0 10px; border-radius: 28px; background: radial-gradient(circle at 50% 50%, #141933 0%, #080a16 90%); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.arena svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hud-box { position: relative; z-index: 2; text-align: center; }
.badge { display: inline-block; background: rgba(0, 240, 255, 0.14); padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--cyan); margin-bottom: 4px; }
.big-x { font-size: 56px; font-weight: 900; letter-spacing: -2px; }
.jet-ico { font-size: 46px; margin-top: 4px; }
.flying .jet-ico { animation: shake 0.18s infinite alternate; }
@keyframes shake { from { transform: translateY(0) scale(1.05); } to { transform: translateY(-7px) scale(1.15); } }
.panel { background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(14px); border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 6px; }
.chip { flex: 1; background: rgba(255, 255, 255, 0.07); border: 1px solid transparent; color: #fff; padding: 8px 4px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer; }
.chip.on { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 240, 255, 0.14); }
.bet-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); padding: 8px 14px; border-radius: 14px; font-size: 11px; font-weight: 800; color: var(--sub); }
.bet-row input { background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; text-align: center; width: 110px; outline: none; }

.btn-main { width: 100%; padding: 14px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--cyan), var(--indigo)); color: #000; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 240, 255, 0.3); }
.btn-main:active { transform: scale(0.96); }
.btn-main.gold { background: linear-gradient(135deg, #ffd000, #ff9500); color: #000; }
.btn-main.pink { background: linear-gradient(135deg, var(--pink), #ff5e00); color: #fff; }

.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-bottom: 8px; }
.g-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; cursor: pointer; }
.g-card:active { transform: scale(0.95); border-color: var(--cyan); }
.g-card.wide { grid-column: span 2; flex-direction: row; text-align: left; gap: 12px; background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(0, 240, 255, 0.12)); }
.g-card span { font-size: 28px; }
.g-card b { font-size: 13px; }
.g-card small { font-size: 11px; color: var(--cyan); font-weight: 700; }

.mg-box { flex: 1; display: none; flex-direction: column; justify-content: space-between; }
.mg-head { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--line); padding: 8px 12px; border-radius: 14px; font-size: 13px; font-weight: 800; }
.back-btn { background: rgba(255, 255, 255, 0.12); border: none; color: #fff; padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 11px; cursor: pointer; }
.mg-center { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 24px; margin: 8px 0; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }

.jet-bar { display: flex; gap: 4px; width: 100%; }
.j-st { flex: 1; text-align: center; font-size: 10px; font-weight: 800; padding: 5px 2px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: var(--sub); }
.j-st.ok { background: var(--cyan); color: #000; }

.mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 270px; width: 100%; margin: auto; }
.m-cell { aspect-ratio: 1 / 1; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
.m-cell.safe { background: rgba(0, 240, 255, 0.22); border-color: var(--cyan); }
.m-cell.boom { background: rgba(255, 42, 133, 0.28); border-color: var(--pink); }

.slots-row, .safes-row { display: flex; gap: 10px; }
.s-box { width: 74px; height: 84px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; }

.tap-orb { width: 190px; height: 190px; margin: auto; border-radius: 50%; background: radial-gradient(circle, #1e1b4b 0%, #090a14 100%); border: 3px solid var(--cyan); box-shadow: 0 0 35px rgba(0, 240, 255, 0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
.tap-orb:active { transform: scale(0.92); }
.bar-bg { width: 100%; height: 9px; background: rgba(0, 0, 0, 0.5); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--indigo), var(--cyan)); transition: width 0.2s; }
.up-card { flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); padding: 10px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; cursor: pointer; }
.up-card span { font-size: 11px; color: var(--sub); }
.up-card b { font-size: 13px; color: var(--cyan); }

.soc-item { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.nav-dock { position: relative; z-index: 5; display: flex; margin: 0 14px 16px; padding: 6px; background: rgba(14, 17, 30, 0.92); border: 1px solid var(--line); border-radius: 24px; gap: 4px; }
.nav-btn { flex: 1; background: transparent; border: none; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 18px; cursor: pointer; font-weight: 800; font-size: 11px; }
.nav-btn span { font-size: 18px; }
.nav-btn.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.45), rgba(0, 240, 255, 0.25)); color: #fff; }

.modal-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
.modal-wrap.show { display: flex; }
.pop-txt { position: absolute; font-size: 22px; font-weight: 900; color: var(--cyan); pointer-events: none; z-index: 50; animation: floatUp 0.7s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-65px); } }
</style>
</head>
<body>

<div class="orb o1"></div>
<div class="orb o2"></div>

<header class="top-bar">
    <button class="user-pill" onclick="openModal()">
        <span class="ava" id="ava">A</span>
        <span id="username">CryptoPilot</span>
        <span style="color:var(--sub)">✎</span>
    </button>
    <div class="top-r">
        <button class="snd-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
        <div class="bal-pill"><span>$AERO</span><span id="balance">1 000</span></div>
    </div>
</header>

<main id="p-crash" class="screen active">
    <div class="hist-bar" id="history-strip">
        <span class="h-chip win">x14.20</span>
        <span class="h-chip loss">x1.15</span>
        <span class="h-chip">x3.40</span>
        <span class="h-chip win">x28.90</span>
    </div>
    <div class="arena" id="radar-screen">
        <svg viewBox="0 0 300 160" preserveAspectRatio="none">
            <path id="flight-curve" d="M 12 148 Q 12 148 12 148" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="hud-box">
            <div class="badge" id="flight-status">ГОТОВ К ЗАПУСКУ</div>
            <div class="big-x" id="mult-text">x1.00</div>
            <div class="jet-ico" id="rocket-ship">🚀</div>
        </div>
    </div>
    <div class="panel">
        <div class="row">
            <button class="chip" onclick="setBet('bet-input', 100)">100</button>
            <button class="chip" onclick="setBet('bet-input', 500)">500</button>
            <button class="chip" onclick="halfBet('bet-input')">½</button>
            <button class="chip" onclick="doubleBet('bet-input')">2X</button>
            <button class="chip on" onclick="maxBet('bet-input')">MAX</button>
        </div>
        <div class="bet-row"><span>СТАВКА</span><input type="number" id="bet-input" value="100" min="10"><span style="color:var(--cyan)">$AERO</span></div>
        <button class="btn-main" id="crash-btn" onclick="handleCrash()">🚀 ЗАПУСК (3-2-1)</button>
    </div>
</main>
<div class="modal-wrap" id="name-modal">
    <div class="panel" style="width:100%;max-width:300px;text-align:center">
        <h3>Позывной пилота</h3>
        <input type="text" id="nick-input" maxlength="15" style="padding:12px;border-radius:12px;border:1px solid var(--cyan);background:#000;color:#fff;text-align:center;font-size:16px">
        <button class="btn-main" onclick="saveNick()">Сохранить</button>
        <button class="chip" onclick="closeModal()">Отмена</button>
    </div>
</div>

<nav class="nav-dock">
    <button class="nav-btn active" onclick="goTab('crash', this)"><span>🚀</span>Краш</button>
    <button class="nav-btn" onclick="goTab('arcade', this)"><span>🎮</span>Игры (8)</button>
    <button class="nav-btn" onclick="goTab('mine', this)"><span>⚡</span>Фарм</button>
    <button class="nav-btn" onclick="goTab('hype', this)"><span>🪂</span>Дроп</button>
</nav>
<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
var uid = 'u' + Math.floor(Math.random() * 999999);
var defNick = 'CryptoPilot';

if (tg) {
    try {
        tg.expand();
        tg.ready();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            uid = tg.initDataUnsafe.user.id;
            if (tg.initDataUnsafe.user.first_name) defNick = tg.initDataUnsafe.user.first_name;
        }
    } catch (e) {}
}

var DB = 'aero_nebula_v13';
var d = JSON.parse(localStorage.getItem(DB)) || {
    nick: '', balance: 1000, energy: 1000, maxEnergy: 1000,
    tapPower: 5, tapLvl: 1, tapCost: 250, nodeLvl: 0, nodeCost: 500,
    passive: 0, lastInvite: 0, tasks: { tg: false, yt: false }
};

function save() { try { localStorage.setItem(DB, JSON.stringify(d)); } catch (e) {} }
function getNick() { return d.nick ? d.nick : defNick; }
function msg(t) { if (tg && tg.showAlert) { try { tg.showAlert(t); } catch (e) { alert(t); } } else alert(t); }

var snd = true, actx = null;
function toggleSound() {
    snd = !snd;
    document.getElementById('sound-btn').innerText = snd ? '🔊' : '🔇';
    if (snd) pop();
}
function pop() {
    if (!snd) return;
    try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(190, actx.currentTime);
        o.frequency.exponentialRampToValueAtTime(380, actx.currentTime + 0.06);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.07);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + 0.07);
    } catch (e) {}
}
function winSnd() { pop(); setTimeout(pop, 90); }
function boomSnd() {
    if (!snd || !actx) return;
    try {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(105, actx.currentTime);
        g.gain.setValueAtTime(0.16, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + 0.3);
    } catch (e) {}
}

function openModal() { document.getElementById('nick-input').value = getNick(); document.getElementById('name-modal').classList.add('show'); }
function closeModal() { document.getElementById('name-modal').classList.remove('show'); }
function saveNick() { var v = document.getElementById('nick-input').value.trim(); if (v.length >= 2) { d.nick = v; save(); render(); closeModal(); } }

function goTab(id, btn) {
    document.querySelectorAll('.screen').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('p-' + id).classList.add('active');
    if (btn) btn.classList.add('active');
    pop();
}

function openGame(id) {
    document.getElementById('lobby').style.display = 'none';
    document.querySelectorAll('.mg-box').forEach(function(v) { v.style.display = 'none'; });
    document.getElementById('g-' + id).style.display = 'flex';
    pop();
}
function closeGames() {
    document.querySelectorAll('.mg-box').forEach(function(v) { v.style.display = 'none'; });
    document.getElementById('lobby').style.display = 'grid';
    pop();
}

function setBet(id, v) { document.getElementById(id).value = v; pop(); }
function halfBet(id) { var e = document.getElementById(id); e.value = Math.max(10, Math.floor(Number(e.value) / 2)); }
function doubleBet(id) { var e = document.getElementById(id); e.value = Math.min(Math.floor(d.balance), Math.floor(Number(e.value) * 2)); }
function maxBet(id) { document.getElementById(id).value = Math.max(10, Math.floor(d.balance)); }
function takeBet(id) {
    var b = Math.floor(Number(document.getElementById(id).value));
    if (b < 10 || b > d.balance) { msg('Недостаточно $AERO! Нафарми во вкладке Фарм.'); return 0; }
    d.balance -= b; save(); render(); return b;
}

var flying = false, cdown = false, mult = 1, cpoint = 1, cbet = 0, floop = null, fprog = 0;
function handleCrash() {
    if (cdown) return;
    var btn = document.getElementById('crash-btn'), rad = document.getElementById('radar-screen'), mt = document.getElementById('mult-text'), st = document.getElementById('flight-status');
    if (!flying) {
        var b = takeBet('bet-input'); if (!b) return;
        cbet = b; cdown = true;
        document.getElementById('flight-curve').setAttribute('d', 'M 12 148 Q 12 148 12 148');
        var c = 3; st.innerText = 'ПРИГОТОВЬСЯ К СТАРТУ'; mt.style.color = '#ffc800'; mt.innerText = c; btn.innerText = '⏳ ' + c + '...'; pop();
        var t = setInterval(function() {
            c--;
            if (c > 0) { mt.innerText = c; btn.innerText = '⏳ ' + c + '...'; pop(); }
            else {
                clearInterval(t); cdown = false; flying = true; mult = 1; fprog = 0;
                var r = Math.random();
                cpoint = r < 0.15 ? 1.1 + Math.random() * 0.2 : (r < 0.65 ? 1.3 + Math.random() * 1.7 : (r < 0.9 ? 3 + Math.random() * 7 : 10 + Math.random() * 35));
                rad.classList.add('flying'); mt.style.color = '#fff'; mt.innerText = 'x1.00'; st.innerText = 'В ПОЛЕТЕ...'; btn.classList.add('gold');
                floop = setInterval(function() {
                    mult += 0.02 + (mult * 0.015); fprog += 0.015;
                    var p = Math.min(1, fprog), ex = 12 + p * 275, ey = 148 - Math.pow(p, 1.4) * 132, cx = 12 + p * 160;
                    document.getElementById('flight-curve').setAttribute('d', 'M 12 148 Q ' + cx + ' 148 ' + ex + ' ' + ey);
                    mt.innerText = 'x' + mult.toFixed(2);
                    btn.innerText = '💰 ЗАБРАТЬ ' + Math.floor(cbet * mult).toLocaleString();
                    if (mult >= cpoint) {
                        clearInterval(floop); flying = false; rad.classList.remove('flying'); mt.style.color = '#ff2a85';
                        st.innerText = '💥 УЛЕТЕЛ НА x' + cpoint.toFixed(2); btn.classList.remove('gold'); btn.innerText = '🚀 ЗАПУСК (3-2-1)';
                        addHist(cpoint); boomSnd();
                    }
                }, 75);
            }
        }, 700);
    } else {
        clearInterval(floop); flying = false; rad.classList.remove('flying');
        var w = Math.floor(cbet * mult); d.balance += w; mt.style.color = '#00f0ff';
        st.innerText = '✅ ЗАБРАНО: +' + w.toLocaleString(); btn.classList.remove('gold'); btn.innerText = '🚀 ЗАПУСК (3-2-1)';
        addHist(mult); winSnd(); save(); render();
    }
}
function addHist(v) {
    var s = document.getElementById('history-strip'), sp = document.createElement('span');
    sp.className = 'h-chip ' + (v < 1.5 ? 'loss' : (v >= 5 ? 'win' : ''));
    sp.innerText = 'x' + v.toFixed(2); s.insertBefore(sp, s.firstChild);
    if (s.children.length > 7) s.removeChild(s.lastChild);
}

var jAct = false, jBet = 0, jSt = 0, jM = Array.of(1.3, 1.8, 2.6, 4.0, 7.0, 15.0, 50.0);
function stepJet() {
    var fb = document.getElementById('jet-fly-btn'), cb = document.getElementById('jet-cash-btn'), rs = document.getElementById('jet-res'), sp = document.getElementById('jet-sprite');
    if (!jAct) { var b = takeBet('jet-bet'); if (!b) return; jBet = b; jSt = 0; jAct = true; document.querySelectorAll('.j-st').forEach(function(x) { x.classList.remove('ok'); }); sp.innerText = '✈️'; sp.style.transform = 'translateY(0)'; }
    if (Math.random() < (0.22 + jSt * 0.055)) { jAct = false; sp.innerText = '💥'; rs.innerText = '💥 ПВО сбило борт!'; document.getElementById('jet-mult').innerText = 'x0.00'; fb.innerText = '✈️ СНОВА'; cb.style.display = 'none'; boomSnd(); }
    else {
        var m = 1.3; jM.forEach(function(v, i) { if (i === jSt) m = v; });
        document.querySelectorAll('.j-st').forEach(function(e, i) { if (i === jSt) e.classList.add('ok'); });
        jSt++; var w = Math.floor(jBet * m); document.getElementById('jet-mult').innerText = 'x' + m.toFixed(1); rs.innerText = '⚡ Бонус! Множитель x' + m.toFixed(1);
        sp.style.transform = 'translateY(-' + (jSt * 4) + 'px) rotate(-' + (jSt * 3) + 'deg)'; pop();
        if (jSt >= 7) { d.balance += w; jAct = false; rs.innerText = '🏆 РЕКОРД x50! +' + w.toLocaleString(); fb.innerText = '✈️ ВЫЛЕТ'; cb.style.display = 'none'; winSnd(); save(); render(); }
        else { fb.innerText = '✈️ ДАЛЬШЕ'; cb.style.display = 'block'; cb.innerText = '💰 ЗАБРАТЬ ' + w.toLocaleString(); }
    }
}
function cashJet() {
    if (!jAct || jSt === 0) return;
    var m = 1.3; jM.forEach(function(v, i) { if (i === jSt - 1) m = v; });
    var w = Math.floor(jBet * m); d.balance += w; jAct = false;
    document.getElementById('jet-res').innerText = '✅ Забрано: +' + w.toLocaleString(); document.getElementById('jet-fly-btn').innerText = '✈️ ВЫЛЕТ'; document.getElementById('jet-cash-btn').style.display = 'none';
    winSnd(); save(); render();
}
var mCnt = 3, mAct = false, mBet = 0, mMul = 1, mLoc = Array.of(), mOp = 0;
function setMines(c, b) { if (mAct) return; mCnt = c; document.querySelectorAll('#g-mines .chip').forEach(function(x) { x.classList.remove('on'); }); b.classList.add('on'); pop(); }
function buildMines() {
    var g = document.getElementById('mines-grid'); g.innerHTML = '';
    for (var i = 0; i < 25; i++) {
        var c = document.createElement('div'); c.className = 'm-cell'; c.innerText = '✦'; c.setAttribute('data-i', i);
        c.onclick = function() { hitMine(Number(this.getAttribute('data-i')), this); };
        g.appendChild(c);
    }
}
function actMines() {
    var b = document.getElementById('mines-btn');
    if (!mAct) {
        var bet = takeBet('mines-bet'); if (!bet) return;
        mBet = bet; mMul = 1; mOp = 0; mAct = true; mLoc = Array.of();
        while (mLoc.length < mCnt) { var r = Math.floor(Math.random() * 25); if (mLoc.indexOf(r) === -1) mLoc.push(r); }
        buildMines(); document.getElementById('mines-mult').innerText = 'x1.00'; b.classList.add('gold'); b.innerText = '💰 ЗАБРАТЬ ' + bet.toLocaleString(); pop();
    } else {
        if (mOp === 0) return;
        d.balance += Math.floor(mBet * mMul); mAct = false; b.classList.remove('gold'); b.innerText = '💎 ИГРАТЬ'; showMines(); winSnd(); save(); render();
    }
}
function hitMine(i, el) {
    if (!mAct || el.classList.contains('safe') || el.classList.contains('boom')) return;
    if (mLoc.indexOf(i) !== -1) { el.classList.add('boom'); el.innerText = '💥'; mAct = false; showMines(); var b = document.getElementById('mines-btn'); b.classList.remove('gold'); b.innerText = '💎 ИГРАТЬ'; boomSnd(); }
    else { el.classList.add('safe'); el.innerText = '💎'; mOp++; mMul = Number((mMul * (1 + 0.14 + mCnt * 0.045)).toFixed(2)); document.getElementById('mines-mult').innerText = 'x' + mMul.toFixed(2); document.getElementById('mines-btn').innerText = '💰 ЗАБРАТЬ ' + Math.floor(mBet * mMul).toLocaleString(); pop(); }
}
function showMines() { document.querySelectorAll('.m-cell').forEach(function(c, i) { if (mLoc.indexOf(i) !== -1) { c.classList.add('boom'); c.innerText = '💣'; } }); }

function playCoin(ch) { var b = takeBet('coin-bet'); if (!b) return; var s = Math.random() < 0.5 ? 'eagle' : 'tails'; document.getElementById('coin-vis').innerText = s === 'eagle' ? '🦅' : '👑'; if (s === ch) { var w = Math.floor(b * 1.95); d.balance += w; document.getElementById('coin-res').innerText = '✅ Победа! +' + w.toLocaleString(); winSnd(); } else { document.getElementById('coin-res').innerText = '❌ Не угадал!'; boomSnd(); } save(); render(); }
function playDice(dir) { var b = takeBet('dice-bet'); if (!b) return; var r = 1 + Math.floor(Math.random() * 100); document.getElementById('dice-roll').innerText = r; if ((dir === 'low' && r < 50) || (dir === 'high' && r > 50)) { var w = Math.floor(b * 1.95); d.balance += w; document.getElementById('dice-res').innerText = '✅ Выпало ' + r + '! +' + w.toLocaleString(); winSnd(); } else { document.getElementById('dice-res').innerText = '❌ Выпало ' + r; boomSnd(); } save(); render(); }
function playWheel() { var b = takeBet('wheel-bet'); if (!b) return; var r = Math.random(), m = r < 0.3 ? 0 : (r < 0.55 ? 0.5 : (r < 0.8 ? 1.5 : (r < 0.93 ? 3 : (r < 0.99 ? 5 : 15)))), w = Math.floor(b * m); d.balance += w; document.getElementById('wheel-res').innerText = m > 0 ? '🎉 Сектор x' + m + '! +' + w.toLocaleString() : '💥 Сектор x0!'; if (m >= 1.5) winSnd(); else boomSnd(); save(); render(); }
var curHL = 7;
function playHiLo(g) { var b = takeBet('hilo-bet'); if (!b) return; var n = 1 + Math.floor(Math.random() * 13), ok = (g === 'hi' && n > curHL) || (g === 'lo' && n < curHL); document.getElementById('hilo-card').innerText = n; curHL = n; if (ok) { var w = Math.floor(b * 1.9); d.balance += w; document.getElementById('hilo-res').innerText = '✅ Выпало ' + n + '! +' + w.toLocaleString(); winSnd(); } else { document.getElementById('hilo-res').innerText = '❌ Выпало ' + n; boomSnd(); } save(); render(); }
function playSlots() { var b = takeBet('slots-bet'); if (!b) return; var ic = Array.of('💎', '🚀', '⚡', '👑', '🔥'), x1 = Array.from(ic).sort(function() { return 0.5 - Math.random(); }).pop(), x2 = Array.from(ic).sort(function() { return 0.5 - Math.random(); }).pop(), x3 = Array.from(ic).sort(function() { return 0.5 - Math.random(); }).pop(); document.getElementById('r1').innerText = x1; document.getElementById('r2').innerText = x2; document.getElementById('r3').innerText = x3; if (x1 === x2 && x2 === x3) { var j = Math.floor(b * 15); d.balance += j; document.getElementById('slots-res').innerText = '🔥 ДЖЕКПОТ x15! +' + j.toLocaleString(); winSnd(); } else if (x1 === x2 || x2 === x3 || x1 === x3) { var p = Math.floor(b * 2); d.balance += p; document.getElementById('slots-res').innerText = '✅ Пара x2! +' + p.toLocaleString(); winSnd(); } else { document.getElementById('slots-res').innerText = '❌ Пусто!'; boomSnd(); } save(); render(); }
function playBoxes(ch) { var b = takeBet('boxes-bet'); if (!b) return; var pz = Math.floor(Math.random() * 3), all = document.querySelectorAll('#g-boxes .s-box'); all.forEach(function(x, i) { x.innerText = i === pz ? '💰' : '💨'; }); if (ch === pz) { var w = Math.floor(b * 2.8); d.balance += w; document.getElementById('boxes-res').innerText = '🎉 Золото! +' + w.toLocaleString(); winSnd(); } else { document.getElementById('boxes-res').innerText = '❌ Пусто!'; boomSnd(); } save(); render(); setTimeout(function() { all.forEach(function(x) { x.innerText = '🔒'; }); }, 900); }

document.getElementById('tap-core').addEventListener('pointerdown', function(e) {
    if (d.energy >= d.tapPower) {
        d.balance += d.tapPower; d.energy -= d.tapPower; pop();
        var n = document.createElement('div'); n.className = 'pop-txt'; n.innerText = '+' + d.tapPower;
        n.style.left = e.clientX + 'px'; n.style.top = (e.clientY - 20) + 'px'; document.body.appendChild(n);
        setTimeout(function() { n.remove(); }, 700); save(); render();
    }
});
function buyBoost(t) {
    if (t === 'tap' && d.balance >= d.tapCost) { d.balance -= d.tapCost; d.tapLvl++; d.tapPower += 5; d.tapCost = Math.floor(d.tapCost * 2); winSnd(); }
    else if (t === 'node' && d.balance >= d.nodeCost) { d.balance -= d.nodeCost; d.nodeLvl++; d.passive += 1200; d.nodeCost = Math.floor(d.nodeCost * 2.2); winSnd(); }
    save(); render();
}
function fmtCD(ms) { var s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h + 'ч ' + m + 'м ' + (s % 60) + 'с'; }
function inviteSquad() {
    var now = Date.now(), lk = 'https://t.me' + uid, tx = '🔥 Залетай в $AERO! 8 мини-игр и Airdrop до листинга!', u = 'https://t.me' + encodeURIComponent(lk) + '&text=' + encodeURIComponent(tx);
    if ((d.lastInvite + 43200000) - now <= 0) { d.lastInvite = now; d.balance += 5000; winSnd(); save(); render(); }
    if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank');
}
function claimSocial(id, rw, u) {
    if (!d.tasks[id]) { d.tasks[id] = true; d.balance += rw; winSnd(); save(); render(); }
    if (tg && u.indexOf('https://t.me') === 0 && tg.openTelegramLink) tg.openTelegramLink(u); else if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank');
}

function render() {
    var now = Date.now();
    document.getElementById('username').innerText = getNick();
    document.getElementById('ava').innerText = getNick().charAt(0).toUpperCase();
    document.getElementById('balance').innerText = Math.floor(d.balance).toLocaleString();
    document.getElementById('passive-rate').innerText = d.passive.toLocaleString();
    document.getElementById('tap-power').innerText = d.tapPower;
    document.getElementById('energy').innerText = Math.floor(d.energy);
    document.getElementById('max-energy').innerText = d.maxEnergy;
    document.getElementById('energy-bar').style.width = ((d.energy / d.maxEnergy) * 100) + '%';
    document.getElementById('lvl-tap').innerText = d.tapLvl;
    document.getElementById('cost-tap').innerText = d.tapCost.toLocaleString();
    document.getElementById('lvl-node').innerText = d.nodeLvl;
    document.getElementById('cost-node').innerText = d.nodeCost.toLocaleString();

    var ib = document.getElementById('invite-btn'), lf = (d.lastInvite + 43200000) - now;
    if (ib) ib.innerText = lf > 0 ? '⏳ Бонус через ' + fmtCD(lf) : '🔥 Пригласить (+5,000)';
    if (d.tasks.tg) document.getElementById('btn-tg').innerText = 'OK ✅';
    if (d.tasks.yt) document.getElementById('btn-yt').innerText = 'OK ✅';

    var ld = Array.of({ n: 'Whale_TON 🐋', s: 420000 }, { n: 'Nebula_Pro', s: 185000 }, { n: getNick() + ' (Вы)', s: Math.floor(d.balance) }, { n: 'AeroJet', s: 45000 });
    ld.sort(function(a, b) { return b.s - a.s; });
    var h = '';
    ld.forEach(function(l, i) { h += '<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.06)"><span>#' + (i + 1) + ' ' + l.n + '</span><b style="color:var(--cyan)">' + l.s.toLocaleString() + ' $AERO</b></div>'; });
    document.getElementById('top-list').innerHTML = h;
}
setInterval(function() { if (d.energy < d.maxEnergy) d.energy = Math.min(d.maxEnergy, d.energy + 5); if (d.passive > 0) d.balance += (d.passive / 3600); save(); render(); }, 1000);
buildMines(); render();
</script>
