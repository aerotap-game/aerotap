    function gT(){if(!s.q.tp&&s.tp>=100){s.q.tp=true;s.sc+=1500;tst('🎉 +1,500 $ATAP!');rQs();rn()}else if(!s.q.tp)tst('❌ Tap '+(100-s.tp)+' more!')}
    function go(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('act'));document.querySelectorAll('.nb').forEach(e=>e.classList.remove('act'));document.getElementById('t-'+t).classList.add('act');document.getElementById('n-'+t).classList.add('act');if(t==='shop')rSh();if(t==='quests')rQs()}
    function rn(){
      document.getElementById('sc').innerText=Math.floor(s.sc).toLocaleString();document.getElementById('stp').innerText='+'+(s.pw*ml);document.getElementById('sph').innerText=s.ph.toLocaleString();document.getElementById('sdy').innerText='Day '+s.sk;
      document.getElementById('tp').innerText='+'+(s.pw*ml)+' per tap';document.getElementById('ub').innerText='⬆️ Tap ('+s.cs+')';document.getElementById('ev').innerText=Math.floor(s.en)+'/'+s.me;document.getElementById('eb').style.width=(s.en/s.me*100)+'%';
      let r='Lvl '+s.lv+': Prop Plane',i='🛩️';if(s.lv>=10){r='Lvl '+s.lv+': Stratosphere';i='🚀'}else if(s.lv>=6){r='Lvl '+s.lv+': Supersonic';i='✈️'}else if(s.lv>=3){r='Lvl '+s.lv+': Business Jet';i='🛫'}
      document.getElementById('rn').innerText=r;document.getElementById('ji').innerText=i;
      if(s.sh){document.getElementById('ib').innerText='📋 Copy Link (Claimed)';document.getElementById('ib').style.background='#1e293b'}
      s.lt=Date.now();try{localStorage.setItem('atap_v16',JSON.stringify(s))}catch(e){}
    }
    function tap(e){if(s.en<s.pw)return;const cr=Math.random()<.1,g=s.pw*ml*(cr?5:1);s.sc+=g;s.en-=s.pw;s.tp++;const el=document.createElement('div');el.className='fn';el.innerText=cr?'🔥 +'+g+' CRIT!':'+'+g;if(cr){el.style.color='#f59e0b';el.style.fontSize='32px'}el.style.left=((e.clientX||150)-25)+'px';el.style.top=((e.clientY||250)-30)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),700);rn()}
    function up(){if(s.sc>=s.cs){s.sc-=s.cs;s.lv++;s.pw++;s.me+=200;s.cs=Math.floor(s.cs*1.8);rn()}else tst('❌ Need '+s.cs)}
    function oB(){ml=3;document.getElementById('jet').classList.add('bst');document.getElementById('ab').innerText='🔥 x3 ON!';rn();setTimeout(()=>{ml=1;document.getElementById('jet').classList.remove('bst');document.getElementById('ab').innerText='📺 Turbo x3';rn()},30000)}
    function trb(){if(ml===3)return;if(Ad)Ad.show().then(oB).catch(oB);else oB()}
    function oS(){const p=new Array(1000,2500,5000,10000),w=p.at(Math.floor(Math.random()*p.length));s.sc+=w;s.en=s.me;s.ls=Date.now();tst('🎰 +'+w.toLocaleString()+' $ATAP & Full Fuel!');rn()}
    function spn(){const w=7200000-(Date.now()-(s.ls||0));if(w>0){tst('⏳ Next spin in '+Math.ceil(w/60000)+'m!');return}if(Ad)Ad.show().then(oS).catch(oS);else oS()}
   function inv(){const l='https://t.me('Join AeroTap: '+l);if(!s.sh){s.sc+=500;s.sh=true;tst('+500 $ATAP claimed!');rn()}else tst('Link copied!')}
    setInterval(()=>{if(s.en<s.me)s.en=Math.min(s.me,s.en+3);if(s.ph>0)s.sc+=s.ph/3600;const w=7200000-(Date.now()-(s.ls||0)),b=document.getElementById('sb');if(b){if(w>0){b.innerText='⏳ '+Math.ceil(w/60000)+'m';b.style.opacity='.6'}else{b.innerText='🎰 Spin (Ad)';b.style.opacity='1'}}rn()},1000);
    rSh();rQs();rn();
  </script>
</body>
